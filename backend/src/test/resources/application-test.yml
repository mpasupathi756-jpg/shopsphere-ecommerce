spring:
  datasource:
    url: jdbc:h2:mem:shopsphere-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql
app:
  bootstrap:
    admin:
      email: admin@example.com
      password: A-Strong-Admin-Passphrase-2026
      display-name: Test Admin
