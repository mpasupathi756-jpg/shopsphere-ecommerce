spring:
  application:
    name: shopsphere-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      issuer: ${JWT_ISSUER:shopsphere}
      secret-base64: ${JWT_SECRET_BASE64:U2hvcFNwaGVyZUxvY2FsRGV2ZWxvcG1lbnRLZXlGb3JKd3QyNTY=}
      access-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh:
      ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:14}
      secure-cookie: ${REFRESH_COOKIE_SECURE:false}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
