spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
          temperature: 0.2
  profiles:
    default: local
  application:
    name: shopsphere-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  orders:
    expiry-scan-ms: ${APP_ORDERS_EXPIRY_SCAN_MS:60000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:shopsphere}
      secret-base64: ${JWT_SECRET_BASE64:}
      access-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh:
      ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:14}
      secure-cookie: ${REFRESH_COOKIE_SECURE:false}
  bootstrap:
    admin:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:ShopSphere Administrator}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
